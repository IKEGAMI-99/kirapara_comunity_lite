<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f3f8">
  <meta name="description" content="きらめきパラダイスのゲーム内コミュニティを外部から閲覧する軽量ビューア">
  <title>キラパラ Community Lite</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div>
        <p class="eyebrow">KIRAPARA COMMUNITY</p>
        <h1>Community Lite</h1>
      </div>
      <div class="header-status" id="updatedAt">読み込み中…</div>
    </div>
  </header>

  <nav class="tabs" aria-label="コミュニティフィード">
    <div class="tabs-inner" id="tabs"></div>
  </nav>

  <main class="page-shell">
    <section class="feed-head">
      <div>
        <h2 id="feedTitle">おすすめ</h2>
        <p>ゲーム内のDiscoveryフィードを閲覧専用で表示します。</p>
      </div>
      <button class="refresh-button" id="refreshButton" type="button">再読み込み</button>
    </section>

    <div class="notice" id="notice" hidden></div>
    <section class="feed" id="feed" aria-live="polite"></section>

    <div class="empty-state" id="emptyState" hidden>
      <strong>まだ表示できる投稿がありません。</strong>
      <span>GitHub ActionsのSecrets設定後、次の取得でここに投稿が並びます。</span>
    </div>
  </main>

  <footer class="site-footer">
    <p>非公式・閲覧専用ビューア。ゲーム運営会社とは関係ありません。</p>
  </footer>

  <template id="postTemplate">
    <article class="post-card">
      <header class="post-author">
        <img class="avatar" alt="" loading="lazy">
        <div class="author-copy">
          <strong class="author-name"></strong>
          <span class="post-meta"></span>
        </div>
      </header>
      <div class="post-copy">
        <h3 class="post-title"></h3>
        <p class="post-content"></p>
      </div>
      <div class="post-images"></div>
      <footer class="post-stats">
        <span class="stat stat-votes"></span>
        <span class="stat stat-replies"></span>
        <span class="stat stat-collections"></span>
      </footer>
    </article>
  </template>

  <script type="module" src="./app.js"></script>
</body>
</html>
