name: Refresh community and publish site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

concurrency:
  group: community-publish
  cancel-in-progress: true

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run parser self-test
        run: node scripts/self-test.mjs

      - name: Restore last published feed cache
        shell: bash
        run: |
          git fetch origin gh-pages:refs/remotes/origin/gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            rm -rf docs/data
            mkdir -p docs/data
            git archive origin/gh-pages data 2>/dev/null | tar -x -C docs || true
          fi

      - name: Refresh Discovery feed
        env:
          KRPR_SERVER_ID: ${{ secrets.KRPR_SERVER_ID }}
          KRPR_GAME_ID: ${{ secrets.KRPR_GAME_ID }}
          KRPR_SIGN: ${{ secrets.KRPR_SIGN }}
          KRPR_TIMESTAMP: ${{ secrets.KRPR_TIMESTAMP }}
          KRPR_USER_ID: ${{ secrets.KRPR_USER_ID }}
          KRPR_ROLE_ID: ${{ secrets.KRPR_ROLE_ID }}
        run: node scripts/fetch-feed.mjs discovery

      - name: Stage static site
        shell: bash
        run: |
          rm -rf /tmp/kirapara-community-site
          mkdir -p /tmp/kirapara-community-site
          cp -a docs/. /tmp/kirapara-community-site/
          touch /tmp/kirapara-community-site/.nojekyll

      - name: Publish gh-pages branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git reset --hard HEAD

          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git switch --force-create gh-pages origin/gh-pages
          else
            git switch --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx
          cp -a /tmp/kirapara-community-site/. .
          git add -A

          if git diff --cached --quiet; then
            echo 'Published site is unchanged.'
            exit 0
          fi

          git commit -m 'Publish community snapshot'
          git push origin HEAD:gh-pages
